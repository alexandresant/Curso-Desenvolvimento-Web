<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <title>Dia 22</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    </head>
        
    <body>

        <div class="divCadastro">
            <h1>Cadastro de notas dos Alunos</h1>
            <form action="index.html" id="formAlunos">
                <input type="text" id="nome" placeholder="Nome do Aluno" autocomplete="of" required>
                <input type="number" id="nota1" placeholder="Nota 1" required>
                <input type="number" id="nota2" placeholder="Nota 2" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
        
        <div class="divAlunos">
            <select id="filtro">
                <option value="todos">Todos</option>
                <option value="aprovado">Aprovados</option>
                <option value="reprovado">Reprovados</option>
            </select>
            <button id="mostrarAlunos">Mostrar Alunos</button>
            <ul id="listaAlunos"></ul>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
